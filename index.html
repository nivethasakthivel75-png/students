<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIST Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <h2>🎓 SIST (SPDR) 2029</h2>
    <div class="links">
        <a href="#">Home</a>
        <a href="#">Technical</a>
        <a href="#">Issues</a>
        <a href="#">Support</a>
        <a href="#">Team</a>
    </div>
</nav>

<div class="container">

    <div class="header">
        <h1>Student Registration</h1>
        <p>Enter the details below to register</p>
    </div>

    <form id="registrationForm">

        <div class="field">
            <span>👤</span>
            <div>
                <label>Username:</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
        </div>

        <div class="field">
            <span>🔒</span>
            <div>
                <label>Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
        </div>

        <div class="field">
            <span>👤</span>
            <div>
                <label>Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter student name" required>
            </div>
        </div>

        <div class="field">
            <span>✉️</span>
            <div>
                <label>Email:</label>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>
        </div>

        <div class="field">
            <span>📞</span>
            <div>
                <label>Age:</label>
                <input type="number" id="age" placeholder="Below 30" required>
            </div>
        </div>

        <div class="field">
            <span>📱</span>
            <div>
                <label>Phone:</label>
                <input type="tel" id="phone" placeholder="10 digit phone number" required>
            </div>
        </div>

        <div class="field">
            <span>🎂</span>
            <div>
                <label>DOB:</label>
                <input type="date" id="dob" required>
            </div>
        </div>

        <div class="field">
            <span>⚧</span>
            <div>
                <label>Gender:</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="field">
            <span>🏛️</span>
            <div>
                <label>Department:</label>
                <select id="dept" required>
                    <option value="">Select Department</option>
                    <option>ECE</option>
                    <option>CSE</option>
                    <option>EEE</option>
                    <option>IT</option>
                    <option>MECH</option>
                </select>
            </div>
        </div>

        <div class="field">
            <span>⭐</span>
            <div>
                <label>Event:</label>
                <select id="event" required>
                    <option value="">Select Event</option>
                    <option>Technical Event</option>
                    <option>Workshop</option>
                    <option>Hackathon</option>
                </select>
            </div>
        </div>

        <div class="field">
            <span>📍</span>
            <div>
                <label>Address:</label>
                <textarea id="address" placeholder="Enter your address" required></textarea>
            </div>
        </div>

        <button type="submit">➤ Submit</button>
        <p id="result"></p>

    </form>
</div>

<script src="script.js"></script>
<link rel="stylesheet"
href="style.css">
</body>
</html>
